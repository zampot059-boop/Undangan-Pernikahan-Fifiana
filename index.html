<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zaenal & Fifiana</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            font-family: Georgia, serif;

            background-color: #fffdf9;

            color: #4b3028;

            overflow-x: hidden;
        }


        /* =========================
           COVER
        ========================= */

        .cover {
            width: 100%;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;

            position: relative;

            background-color: #fffdf9;
        }


        .cover-content {
    width: 100%;
    max-width: 380px;

    padding: 20px;

    text-align: center;

    position: relative;
    z-index: 2;
}


        .judul-kecil {
            font-size: 18px;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }


        .nama-pengantin {
            font-family: cursive;

            font-size: 52px;

            font-weight: normal;

            line-height: 1.1;

            margin-bottom: 20px;
        }


        .tanggal {
            font-size: 16px;

            letter-spacing: 2px;

            margin-bottom: 25px;
        }


        .tombol-buka {
            display: inline-block;

            padding: 12px 28px;

            background-color: #8b634f;

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 15px;
        }


        /* =========================
           ISI UNDANGAN
        ========================= */

        .isi-undangan {
            width: 100%;

            padding: 60px 20px;

            text-align: center;
        }


        .isi-undangan h2 {
            font-size: 28px;

            margin-bottom: 20px;
        }


        .isi-undangan p {
            font-size: 16px;

            line-height: 1.8;
        }.
.batik {
    position: absolute;
    left: 0;
    width: 100%;
    height: 130px;

    background-image: url("batik.jpg");
    background-size: 100% auto;
    background-repeat: no-repeat;
    background-position: center;

    background-color: red;

    z-index: 1;
}
        .batik-atas,
.batik-bawah {
    position: absolute;

    left: 0;

    width: 100%;

    height: 120px;

    object-fit: cover;

    z-index: 1;
}

.batik-atas {
    top: 0;
    object-position: top center;
}

.batik-bawah {
    bottom: 0;
    object-position: bottom center;
}

.cover-content {
    position: relative;
    z-index: 2;
}
    </style>
</head>


<body>


    <!-- COVER -->

    <section class="cover">

    <img src="batik.jpg" class="batik-atas">

    <div class="cover-content">

        <p class="judul-kecil">
            the wedding of
        </p>

        <h1 class="nama-pengantin">
            Zaenal & Fifiana
        </h1>

        <p class="tanggal">
            29 AGUSTUS 2026
        </p>

        <a href="#isi-undangan" class="tombol-buka">
            Buka Undangan
        </a>

    </div>

    <img src="batik.jpg" class="batik-bawah">

</section>


    <!-- ISI UNDANGAN -->

    <section class="isi-undangan"
             id="isi-undangan">

        <h2>
            Selamat Datang
        </h2>

        <p>
            Dengan memohon rahmat dan ridho Allah SWT,
            kami mengundang Anda untuk hadir dalam
            acara pernikahan kami.
        </p>

    </section>


</body>
</html>
